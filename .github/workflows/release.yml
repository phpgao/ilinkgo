name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          ext=""
          if [ "$GOOS" = "windows" ]; then ext=".exe"; fi
          name="ilinkgo_${GOOS}_${GOARCH}${ext}"
          go build -trimpath \
            -ldflags "-s -w -X github.com/phpgao/ilinkgo/cmd.version=${GITHUB_REF_NAME}" \
            -o "dist/${name}" .
          cd dist && sha256sum "${name}" > "${name}.sha256"

      - uses: actions/upload-artifact@v7
        with:
          name: ilinkgo-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*

  release:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: ilinkgo-*
          path: dist
          merge-multiple: true

      - name: Checksums
        run: cd dist && cat *.sha256 > SHA256SUMS && ls -l

      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
